<app-page-shell footerVariant="none" [showBottomNav]="false">
  <section class="not-found">
    <span class="not-found__watermark" aria-hidden="true">404</span>
    <div class="not-found__content">
      <div class="section-kicker">Lỗi 404</div>
      <h1 class="not-found__title">Không tìm thấy trang này</h1>
      <p class="not-found__desc">
        Đường dẫn có thể đã thay đổi, hoặc tin đăng đã được gỡ. Thử tìm lại theo khu vực hoặc tên dự
        án.
      </p>

      <form class="not-found__search" (submit)="$event.preventDefault()">
        <div class="not-found__search-field">
          <label for="nf-kw" class="not-found__sr-label">Từ khoá tìm kiếm</label>
          <input id="nf-kw" type="text" class="text-input" placeholder="Khu vực, dự án, mã tin…" />
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="#5A6663"
            stroke-width="1.5"
            stroke-linecap="round"
            class="not-found__search-icon"
          >
            <circle cx="11" cy="11" r="7" />
            <path d="M20 20l-4.3-4.3" />
          </svg>
        </div>
        <button type="submit" class="btn btn--primary">Tìm kiếm</button>
      </form>

      <div class="not-found__links">
        <a routerLink="/tim-kiem" class="not-found__pill">Mua bán</a>
        <a routerLink="/tim-kiem" class="not-found__pill">Cho thuê</a>
        <a routerLink="/" class="not-found__pill">Dự án</a>
        <a routerLink="/" class="not-found__pill not-found__pill--active">Trang chủ</a>
      </div>
    </div>
  </section>
</app-page-shell>
