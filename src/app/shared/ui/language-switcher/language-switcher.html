<div class="lang" [class.lang--on-dark]="onDark()">
  <button
    type="button"
    class="lang__trigger"
    aria-haspopup="listbox"
    [attr.aria-expanded]="open()"
    [attr.aria-label]="i18n.t('lang.label')"
    (click)="open.set(!open())"
  >
    <svg
      width="16"
      height="16"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.4"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <circle cx="12" cy="12" r="9" />
      <path
        d="M3 12h18M12 3c2.5 2.7 3.8 5.7 3.8 9s-1.3 6.3-3.8 9c-2.5-2.7-3.8-5.7-3.8-9S9.5 5.7 12 3z"
      />
    </svg>
    <span class="lang__current">{{ current().short }}</span>
    <svg
      class="lang__chevron"
      [class.lang__chevron--open]="open()"
      width="12"
      height="12"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path d="M6 9l6 6 6-6" />
    </svg>
  </button>

  @if (open()) {
    <ul class="lang__menu" role="listbox" [attr.aria-label]="i18n.t('lang.label')">
      @for (l of i18n.languages; track l.code) {
        <li role="option" [attr.aria-selected]="l.code === i18n.lang()">
          <button
            type="button"
            class="lang__option"
            [class.lang__option--active]="l.code === i18n.lang()"
            (click)="select(l.code)"
          >
            <span class="lang__option-label">{{ l.label }}</span>
            @if (l.code === i18n.lang()) {
              <svg
                width="14"
                height="14"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M5 12.5l4.5 4.5L19 7.5" />
              </svg>
            }
          </button>
        </li>
      }
    </ul>
  }
</div>
