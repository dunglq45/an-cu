@if (variant() === 'condensed') {
  <div class="agent-card agent-card--condensed">
    <app-avatar-initials [initials]="agent().initials" [size]="40" />
    <div class="agent-card__info">
      <div class="agent-card__name">{{ agent().name }}</div>
      <div class="agent-card__role">{{ agent().role.split('·')[0] }}· chứng chỉ hành nghề</div>
    </div>
    <button type="button" class="agent-card__profile-link">Hồ sơ</button>
  </div>
} @else {
  <div class="agent-card">
    <div class="agent-card__header">
      <app-avatar-initials [initials]="agent().initials" [size]="56" />
      <div>
        <div class="agent-card__name agent-card__name--lg">{{ agent().name }}</div>
        <div class="agent-card__role">{{ agent().role }}</div>
      </div>
    </div>
    @if (agent().certBadge) {
      <span class="agent-card__cert-badge">
        <svg
          width="14"
          height="14"
          viewBox="0 0 24 24"
          fill="none"
          stroke="#6E4C18"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z" />
          <path d="M9 12l2 2 4-4" />
        </svg>
        {{ agent().certBadge }}
      </span>
    }
    <div class="agent-card__actions">
      <button type="button" class="btn btn--primary">
        <svg
          width="17"
          height="17"
          viewBox="0 0 24 24"
          fill="none"
          stroke="#F7F4EE"
          stroke-width="1.4"
          stroke-linecap="round"
        >
          <path
            d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.3 1.8.7 2.6a2 2 0 0 1-.5 2.1L8.1 9.5a16 16 0 0 0 6 6l1.1-1.1a2 2 0 0 1 2.1-.5c.8.4 1.7.6 2.6.7a2 2 0 0 1 1.7 2z"
          />
        </svg>
        Gọi
      </button>
      <button type="button" class="btn btn--secondary">
        <svg
          width="17"
          height="17"
          viewBox="0 0 24 24"
          fill="none"
          stroke="#16403A"
          stroke-width="1.4"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M21 12a8 8 0 1 1-3.2-6.4" />
          <path d="M4 20l1.6-4" />
          <path d="M8 12h8" />
        </svg>
        Zalo
      </button>
    </div>
  </div>
}
