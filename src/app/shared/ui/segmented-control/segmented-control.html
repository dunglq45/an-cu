<div class="segmented" [class.segmented--buttons]="appearance() === 'buttons'">
  @for (option of options(); track option.value) {
    <button
      type="button"
      class="segmented__item"
      [class.segmented__item--active]="option.value === selected()"
      (click)="select(option.value)"
    >
      {{ option.label }}
    </button>
  }
</div>
