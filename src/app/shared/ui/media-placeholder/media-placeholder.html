<div class="media-placeholder">
  @if (imageUrl()) {
    <img class="media-placeholder__img" [src]="imageUrl()" [alt]="alt() || caption()" loading="lazy" />
  } @else {
  @switch (icon()) {
    @case ('building') {
      <svg
        [attr.width]="iconSize()"
        [attr.height]="iconSize()"
        viewBox="0 0 24 24"
        fill="none"
        stroke="#8C918A"
        stroke-width="1"
        stroke-linecap="round"
      >
        <path d="M3 21h18" />
        <path d="M5 21V9l5-3v15" />
        <path d="M14 21V4l5 3v14" />
      </svg>
    }
    @case ('interior') {
      <svg
        [attr.width]="iconSize()"
        [attr.height]="iconSize()"
        viewBox="0 0 24 24"
        fill="none"
        stroke="#8C918A"
        stroke-width="1"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M3 18l6-7 4 5 3-3 5 5" />
        <rect x="3" y="4" width="18" height="16" rx="1" />
      </svg>
    }
    @case ('tour360') {
      <svg
        [attr.width]="iconSize()"
        [attr.height]="iconSize()"
        viewBox="0 0 24 24"
        fill="none"
        stroke="#8C918A"
        stroke-width="1"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <ellipse cx="12" cy="12" rx="9" ry="4.5" />
        <path d="M12 3a9 9 0 0 1 0 18 9 9 0 0 1 0-18z" />
      </svg>
    }
    @case ('floorplan') {
      <svg
        [attr.width]="iconSize()"
        [attr.height]="iconSize()"
        viewBox="0 0 24 24"
        fill="none"
        stroke="#8C918A"
        stroke-width="1"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <rect x="3" y="3" width="18" height="18" />
        <path d="M3 13h9M12 3v18M12 8h9" />
      </svg>
    }
    @case ('progress') {
      <svg
        [attr.width]="iconSize()"
        [attr.height]="iconSize()"
        viewBox="0 0 24 24"
        fill="none"
        stroke="#8C918A"
        stroke-width="1"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M3 20h18" />
        <path d="M5 20V9h6v11" />
        <path d="M13 20V4h6v16" />
      </svg>
    }
    @case ('perspective') {
      <svg
        [attr.width]="iconSize()"
        [attr.height]="iconSize()"
        viewBox="0 0 24 24"
        fill="none"
        stroke="#8C918A"
        stroke-width="1"
        stroke-linecap="round"
      >
        <path d="M3 11l9-7 9 7" />
        <path d="M5 10v11h14V10" />
        <path d="M10 21v-6h4v6" />
      </svg>
    }
    @default {
      <svg
        [attr.width]="iconSize()"
        [attr.height]="iconSize()"
        viewBox="0 0 24 24"
        fill="none"
        stroke="#8C918A"
        stroke-width="1"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M3 21h18" />
        <path d="M6 21V7l6-4 6 4v14" />
        <path d="M10 21v-5h4v5" />
        <path d="M9 8h1M14 8h1M9 11h1M14 11h1" />
      </svg>
    }
  }
  @if (caption()) {
    <span class="media-placeholder__caption">{{ caption() }}</span>
  }
  }
  <ng-content />
</div>
