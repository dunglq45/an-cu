<div class="mobile-topbar">
  <a routerLink="/" class="mobile-topbar__brand">
    <span class="mobile-topbar__logo-mark">
      <svg
        width="15"
        height="15"
        viewBox="0 0 24 24"
        fill="none"
        stroke="#16403A"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M3 11l9-7 9 7" />
        <path d="M5 10v10h14V10" />
      </svg>
    </span>
    <span class="mobile-topbar__wordmark">AN CƯ</span>
  </a>
  <div class="mobile-topbar__actions">
    <app-language-switcher [onDark]="true" />
    <button type="button" [attr.aria-label]="i18n.t('topbar.notifications')" class="mobile-topbar__icon-btn">
      <svg
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="#F7F4EE"
        stroke-width="1.4"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M18 16v-5a6 6 0 1 0-12 0v5l-1.5 2.5h15z" />
        <path d="M10 19a2 2 0 0 0 4 0" />
      </svg>
    </button>
    <button type="button" [attr.aria-label]="i18n.t('topbar.menu')" class="mobile-topbar__icon-btn">
      <svg
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="#F7F4EE"
        stroke-width="1.5"
        stroke-linecap="round"
      >
        <path d="M4 7h16M4 12h16M4 17h16" />
      </svg>
    </button>
  </div>
</div>
