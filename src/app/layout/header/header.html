<header class="app-header">
  <div class="app-header__left">
    <a routerLink="/" class="app-header__logo">
      <span class="app-header__logo-mark">
        <svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="#F7F4EE"
          stroke-width="1.3"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M3 11l9-7 9 7" />
          <path d="M5 10v10h14V10" />
          <path d="M10 20v-6h4v6" />
        </svg>
      </span>
      <span class="app-header__wordmark">AN CƯ</span>
    </a>
    <nav class="app-header__nav">
      <a
        routerLink="/tim-kiem"
        class="app-header__nav-link"
        [class.app-header__nav-link--active]="activeNav() === 'mua-ban'"
        >{{ i18n.t('nav.buy') }}</a
      >
      <a
        routerLink="/tim-kiem"
        class="app-header__nav-link"
        [class.app-header__nav-link--active]="activeNav() === 'cho-thue'"
        >{{ i18n.t('nav.rent') }}</a
      >
      <a
        routerLink="/"
        class="app-header__nav-link"
        [class.app-header__nav-link--active]="activeNav() === 'du-an'"
        >{{ i18n.t('nav.projects') }}</a
      >
      <a
        routerLink="/"
        class="app-header__nav-link"
        [class.app-header__nav-link--active]="activeNav() === 'moi-gioi'"
        >{{ i18n.t('nav.agents') }}</a
      >
      <a
        routerLink="/"
        class="app-header__nav-link"
        [class.app-header__nav-link--active]="activeNav() === 'tin-tuc'"
        >{{ i18n.t('nav.news') }}</a
      >
    </nav>
  </div>
  <div class="app-header__right">
    <app-language-switcher />
    @if (showPhoneIcon()) {
      <a routerLink="/" class="app-header__phone-link">
        <svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="#16403A"
          stroke-width="1.3"
          stroke-linecap="round"
        >
          <path
            d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.3 1.8.7 2.6a2 2 0 0 1-.5 2.1L8.1 9.5a16 16 0 0 0 6 6l1.1-1.1a2 2 0 0 1 2.1-.5c.8.4 1.7.6 2.6.7a2 2 0 0 1 1.7 2z"
          />
        </svg>
        1900 6688
      </a>
    } @else {
      <span class="app-header__phone-text">1900 6688</span>
    }
    <button type="button" class="btn btn--primary">{{ i18n.t(ctaKey()) }}</button>
  </div>
</header>
